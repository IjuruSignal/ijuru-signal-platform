services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ijuru-signal-app
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - ./data:/app/data
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_PROVIDER=${DB_PROVIDER:-sqlite}
      - SQLITE_PATH=/app/data/app.sqlite
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/ijuru_signal}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - AI_API_KEY=${AI_API_KEY:-}
      - AI_PROVIDER=${AI_PROVIDER:-}
      - AI_MODEL=${AI_MODEL:-}
      - AI_BASE_URL=${AI_BASE_URL:-}
      - AI_ALLOWED_HOSTS=${AI_ALLOWED_HOSTS:-}
      - AUTO_SEED=${AUTO_SEED:-true}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  postgres:
    image: postgres:18-alpine
    container_name: ijuru-signal-postgres
    restart: unless-stopped
    profiles:
      - postgres
      - full
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ijuru_signal}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  pgdata:
